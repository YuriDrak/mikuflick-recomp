# Builds the port for every platform it ships on. The iOS IPA is unsigned (sign it with your own
# certificate or a sideloading app); the Android APK is a debug build signed with a throwaway key
# made on the runner, so installing a newer one over it needs an uninstall first. Neither contains
# game data: both import the player's own IPA on first start.
#
# Releasing: push a version tag from your machine, e.g.
#     git tag v0.4.1 && git push origin v0.4.1
# The workflow builds everything, stamps the version into the iOS app, then creates the GitHub
# release with the Linux tarball, the iOS IPA, the Android APK and an AltStore/SideStore/Feather
# source (altsource.json, ios/altsource.sh).
# Source URL: https://github.com/<owner>/<repo>/releases/latest/download/altsource.json
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (desktop)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: Build
        run: make -C port -j"$(nproc)"
      - name: Build mfextract
        run: make -C port ../build/mfextract
      - name: Package
        if: github.ref_type == 'tag'
        run: |
          # ADJUST: list here the files that make up the Linux build (game binary, mfextract, ...)
          mkdir -p dist/MikuFlick-linux
          cp build/mfextract dist/MikuFlick-linux/
          tar -C dist -czf dist/MikuFlick-linux-x86_64.tar.gz MikuFlick-linux
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-linux
          path: dist/MikuFlick-linux-x86_64.tar.gz
          if-no-files-found: error

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Cache SDL sources
        uses: actions/cache@v4
        with:
          path: ios/build/deps
          key: ios-deps-${{ hashFiles('android/SHA256SUMS', 'ios/App/fetch-deps.sh') }}
      - name: Build
        run: make -C ios device CONFIG=Release
      - name: Stage app
        run: |
          mkdir -p dist/Payload
          cp -R ios/build/iphoneos/Release-iphoneos/MikuFlick.app dist/Payload/
      - name: Release version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          BUILD: ${{ github.run_number }}
        run: |
          version=$(printf '%s' "$TAG" | sed -E 's/^[^0-9]*//')   # v0.4.0 -> 0.4.0
          [ -n "$version" ] || { echo "tag $TAG has no version number"; exit 1; }
          plist=dist/Payload/MikuFlick.app/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" -c "Set :CFBundleVersion $BUILD" "$plist"
      - name: Package IPA
        run: cd dist && zip -qry MikuFlick-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MikuFlick-ios-unsigned-${{ github.sha }}
          path: dist/MikuFlick-unsigned.ipa
          if-no-files-found: error
      - name: Build the AltSource
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          version=$(printf '%s' "$TAG" | sed -E 's/^[^0-9]*//')   # v0.4.1 -> 0.4.1
          IPA="MikuFlick-$version-iOS.ipa"
          # The release does not exist yet: use the tag message as notes (empty if lightweight tag)
          NOTES=$(git for-each-ref --format='%(contents)' "refs/tags/$TAG" || true)
          export NOTES
          mv dist/MikuFlick-unsigned.ipa "dist/$IPA"
          sh ios/altsource.sh dist/Payload/MikuFlick.app "dist/$IPA" \
            "https://github.com/$REPO/releases/download/$TAG/$IPA" dist/altsource.json
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-ios
          path: |
            dist/MikuFlick-*-iOS.ipa
            dist/altsource.json
          if-no-files-found: error

  android:
    name: Android (debug APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Cache downloads and Gradle
        uses: actions/cache@v4
        with:
          path: |
            android/third_party/dl
            android/third_party/gradle-home/caches
            android/third_party/gradle-home/wrapper
          key: android-${{ hashFiles('android/SHA256SUMS', 'android/Makefile', 'android/**/*.gradle') }}
      - name: Toolchain
        run: make -C android toolchain
      - name: SDK
        run: |
          yes | make -C android licenses > /dev/null
          make -C android sdk
      - name: Build
        run: make -C android apk
      - uses: actions/upload-artifact@v4
        with:
          name: MikuFlick-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Name the release APK
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(printf '%s' "$TAG" | sed -E 's/^[^0-9]*//')
          cp android/app/build/outputs/apk/debug/app-debug.apk "mikuflick-$version-android.apk"
      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: release-android
          path: mikuflick-*-android.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: github.ref_type == 'tag'
    needs: [linux, ios, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the release and upload assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: assets
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          ls -l assets
          if gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" assets/* --clobber -R "$REPO"
          else
            gh release create "$TAG" assets/* --title "$TAG" --generate-notes --verify-tag -R "$REPO"
          fi
