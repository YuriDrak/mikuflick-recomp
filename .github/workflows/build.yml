# Builds the port for every platform it ships on. The iOS IPA is unsigned (sign it with your own
# certificate or a sideloading app); the Android APK is a debug build signed with a throwaway key
# made on the runner, so installing a newer one over it needs an uninstall first. Neither contains
# game data: both import the player's own IPA on first start.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (desktop)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev
      - name: Build
        run: make -C port -j"$(nproc)"
      - name: Build mfextract
        run: make -C port ../build/mfextract

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Cache SDL sources
        uses: actions/cache@v4
        with:
          path: ios/build/deps
          key: ios-deps-${{ hashFiles('android/SHA256SUMS', 'ios/App/fetch-deps.sh') }}
      - name: Build
        run: make -C ios device CONFIG=Release
      - name: Package IPA
        run: |
          mkdir -p dist/Payload
          cp -R ios/build/iphoneos/Release-iphoneos/MikuFlick.app dist/Payload/
          cd dist && zip -qry MikuFlick-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: MikuFlick-ios-unsigned-${{ github.sha }}
          path: dist/MikuFlick-unsigned.ipa
          if-no-files-found: error

  android:
    name: Android (debug APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache downloads and Gradle
        uses: actions/cache@v4
        with:
          path: |
            android/third_party/dl
            android/third_party/gradle-home/caches
            android/third_party/gradle-home/wrapper
          key: android-${{ hashFiles('android/SHA256SUMS', 'android/Makefile', 'android/**/*.gradle') }}
      - name: Toolchain
        run: make -C android toolchain
      - name: SDK
        run: |
          yes | make -C android licenses > /dev/null
          make -C android sdk
      - name: Build
        run: make -C android apk
      - uses: actions/upload-artifact@v4
        with:
          name: MikuFlick-android-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
